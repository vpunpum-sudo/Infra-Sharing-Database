<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 104" fill="none">
  <defs>
    <!-- Card Drop Shadow -->
    <filter id="master-banner-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.07" />
    </filter>

    <!-- ITEL 3D Blue Globe Radial Gradient -->
    <radialGradient id="master-globe-grad" cx="38%" cy="24%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#8cd4fd" />
      <stop offset="48%" stop-color="#1e78d6" />
      <stop offset="80%" stop-color="#0f4ba3" />
      <stop offset="100%" stop-color="#072b6b" />
    </radialGradient>

    <!-- Metallic Orbit Gradient -->
    <linearGradient id="master-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Metallic Text Fill Gradient -->
    <linearGradient id="master-metal-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="51%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- 1. White Rounded Card Container matching image.png -->
  <rect 
    x="6" 
    y="6" 
    width="828" 
    height="92" 
    rx="24" 
    fill="#ffffff" 
    stroke="#e2e8f0" 
    stroke-width="1.5" 
    filter="url(#master-banner-shadow)" 
  />

  <!-- 2. SYMPHONY LOGO (Exact 6-facet geometry matching original) -->
  <g transform="translate(36, 0)">
    <!-- S Emblem: Height = 60, centered at Y = 52 (from Y = 22 to Y = 82) -->
    <!-- Upper Prism -->
    <polygon points="12,49 36,22 36,49" fill="#eb5527" />
    <polygon points="36,22 68,22 68,49" fill="#db3b15" />
    <polygon points="36,22 68,49 36,49" fill="#f57038" />

    <!-- Lower Prism -->
    <polygon points="12,55 12,82 44,82" fill="#db3b15" />
    <polygon points="12,55 44,82 44,55" fill="#f57038" />
    <polygon points="44,55 44,82 68,55" fill="#eb5527" />

    <!-- Wordmark SYMPHONY -->
    <text 
      x="80" 
      y="61" 
      fill="#18181b" 
      font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="31" 
      letter-spacing="2"
    >
      SYMPHONY
    </text>
  </g>

  <!-- Separator Bullet 1 -->
  <circle cx="344" cy="52" r="4.5" fill="#475569" />

  <!-- 3. UIH LOGO (Exact mathematical geometry matching original, scaled +20%) -->
  <g transform="translate(456, 52) scale(1.2) translate(-77.5, -52)">
    <!-- Height = 60 scaled to 72, Stroke = 17, Color = #0038b8 -->
    <!-- U: Rounded outer bottom-left (radius 22), sharp square 90-degree outer bottom-right -->
    <path 
      d="M 0,22 L 0,60 A 22,22 0 0,0 22,82 L 56,82 L 56,22 L 39,22 L 39,65 L 22,65 A 5,5 0 0,1 17,60 L 17,22 Z" 
      fill="#0038b8" 
    />
    <!-- I: Solid vertical bar -->
    <path 
      d="M 70,22 L 87,22 L 87,82 L 70,82 Z" 
      fill="#0038b8" 
    />
    <!-- H: Two vertical bars with central crossbar -->
    <path 
      d="M 101,22 L 118,22 L 118,43.5 L 138,43.5 L 138,22 L 155,22 L 155,82 L 138,82 L 138,60.5 L 118,60.5 L 118,82 L 101,82 Z" 
      fill="#0038b8" 
    />
  </g>

  <!-- Separator Bullet 2 -->
  <circle cx="568" cy="52" r="4.5" fill="#475569" />

  <!-- 4. ITEL LOGO (Exact 3D globe + Telecom + Waves matching original) -->
  <g transform="translate(606, 0)">
    <!-- Globe: Center (28, 52), Radius = 24 -->
    <!-- Rear Orbit -->
    <ellipse cx="28" cy="52" rx="34" ry="11" stroke="url(#master-orbit-grad)" stroke-width="1.6" transform="rotate(-16 28 52)" fill="none" opacity="0.8" />
    <path d="M 44,33 L 39,32 L 43,36 Z" fill="#64748b" />
    <!-- 3D Blue Sphere -->
    <circle cx="28" cy="52" r="23" fill="url(#master-globe-grad)" />
    <!-- Specular Highlight -->
    <path d="M 14,42 Q 26,34 41,42 Q 26,37 14,42 Z" fill="#ffffff" opacity="0.85" />
    <!-- Front Orbit -->
    <path d="M -6,58 Q 20,70 62,49" stroke="url(#master-orbit-grad)" stroke-width="2.2" fill="none" />
    <!-- INTERLINK Metallic Banner -->
    <g transform="translate(28, 57) rotate(-10)">
      <text 
        x="0" 
        y="0" 
        text-anchor="middle" 
        fill="url(#master-metal-fill)" 
        stroke="#0f172a" 
        stroke-width="0.8" 
        font-family="'Impact', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="9" 
        letter-spacing="0.6"
      >
        INTERLINK
      </text>
    </g>

    <!-- Telecom Wordmark (Trebuchet MS with authentic downward serifs on T) -->
    <g transform="translate(68, 0)">
      <text 
        x="0" 
        y="54" 
        fill="#ea580c" 
        font-family="'Trebuchet MS', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="-0.5"
      >
        Telecom
      </text>

      <!-- 3 Concentric Signal Waves -->
      <g stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" fill="none" transform="translate(126, 21)">
        <path d="M 0,17 A 8,8 0 0,1 6,23" />
        <path d="M 3,11 A 14,14 0 0,1 12,23" />
        <path d="M 6,5 A 20,20 0 0,1 18,23" />
      </g>

      <!-- Subtitle: PUBLIC COMPANY LIMITED -->
      <text 
        x="1.5" 
        y="67" 
        fill="#ea580c" 
        font-family="'Trebuchet MS', system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="7.5" 
        letter-spacing="1.2"
      >
        PUBLIC COMPANY LIMITED
      </text>
    </g>
  </g>
</svg>
